name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://revixplus.com
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push; Coolify builds from the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: revixplus-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
